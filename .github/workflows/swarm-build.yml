# SWARM Messenger for Android: build, test, scan and pre-release the website flavor.
#
# Runs on GitHub-hosted ubuntu-latest (the repository is public, so the minutes are free). Upstream's own
# android.yml is left untouched: it targets ubuntu-latest-8-cores, a larger runner this organisation does
# not have, and it only triggers on upstream's branch names and on pull requests.
#
# Pushes to swarm-main publish a GitHub pre-release with the APKs and SHA256SUMS.txt. Pull requests and
# manual runs build, test and scan, and publish nothing.
name: SWARM build

on:
  push:
    branches:
      - swarm-main
      - swarm-next
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VARIANT: websiteProdDebug
  # report: print what the scan finds and pass. enforce: fail the build on any finding.
  SWARM_SCAN_MODE: enforce

jobs:
  apk:
    name: APK (websiteProdDebug) and endpoint scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/julia* \
                      /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /opt/az \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/swarm-main' && github.ref != 'refs/heads/swarm-next' }}

      - name: Fit Gradle into a 16 GB runner
        # gradle.properties asks for a 12 GB Gradle heap and a 4 GB Kotlin daemon. The app module's Kotlin
        # compile needs more than 3 GB (run 36344336536 died with "GC overhead limit exceeded"), and two
        # parallel workers is what 16 GB holds. A Gradle user-home gradle.properties overrides the project's.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.workers.max=2
          EOF

      - name: Build the APK
        run: ./gradlew :Signal-Android:assembleWebsiteProdDebug --stacktrace

      - name: SWARM endpoint scan
        run: |
          set -o pipefail
          python3 scripts/swarm/endpoint_scan.py --variant "$VARIANT" --mode "$SWARM_SCAN_MODE" | tee endpoint-scan.txt

      - name: SWARM endpoints in BuildConfig
        # The APK must be configured for SWARM's chat server and libsignal's SWARM environment. This is what a
        # release is checked against again before anything is published.
        run: |
          set -euo pipefail
          config=app/build/generated/source/buildConfig/websiteProd/debug/org/thoughtcrime/securesms/BuildConfig.java
          grep -E ' (SIGNAL_URL|STORAGE_URL|SIGNAL_CDN_URL|LIBSIGNAL_NET_ENV|SWARM_LIBSIGNAL_NET|APPLICATION_ID) =' "$config" | sed 's/^ *//' | tee buildconfig-endpoints.txt
          grep -q 'String SIGNAL_URL = "https://chat.swarm.green";' buildconfig-endpoints.txt || { echo "::error::BuildConfig.SIGNAL_URL is not https://chat.swarm.green"; exit 1; }
          grep -q 'LIBSIGNAL_NET_ENV = org.signal.libsignal.net.Network.Environment.SWARM;' buildconfig-endpoints.txt || { echo "::error::libsignal is not on its SWARM environment"; exit 1; }

      - name: Collect the APKs and their SHA-256 sums
        id: collect
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version=$(grep -oP 'VERSION_NAME = "\K[^"]+' app/build/generated/source/buildConfig/websiteProd/debug/org/thoughtcrime/securesms/BuildConfig.java || echo unknown)
          mkdir -p dist
          for apk in app/build/outputs/apk/websiteProd/debug/*.apk; do
            base=$(basename "$apk" .apk)
            abi=$(echo "$base" | grep -oE 'universal|arm64-v8a|armeabi-v7a|x86_64|x86' | head -1)
            cp "$apk" "dist/swarm-messenger-android-${version}-${short_sha}-${abi:-apk}.apk"
          done
          cp endpoint-scan.txt dist/endpoint-scan.txt
          cp buildconfig-endpoints.txt dist/buildconfig-endpoints.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the APKs for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swarm-messenger-android-apk
          path: dist/
          retention-days: 14
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/julia* \
                      /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /opt/az \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Fit Gradle into a 16 GB runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.workers.max=2
          EOF

      - name: Run the unit tests
        run: >-
          ./gradlew --continue
          :Signal-Android:testWebsiteProdDebugUnitTest
          :feature:registration:testDebugUnitTest
          :feature:app-settings:testDebugUnitTest
          :lib:libsignal-service:test
          :lib:network:test

      - name: Keep the test reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Pre-release
    needs: [apk, unit-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/swarm-main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swarm-messenger-android-apk
          path: dist

      - name: Refuse to publish anything that is not a SWARM build
        # Nothing reaches a release unless the endpoint scan ran in enforce mode with no failure and the APK's
        # BuildConfig names SWARM's chat server and libsignal's SWARM environment. A build with Signal's
        # servers in it must never be offered for download (planner rule, 2026-09-27).
        run: |
          set -euo pipefail
          grep -qx 'SWARM endpoint scan, variant websiteProdDebug, mode enforce' dist/endpoint-scan.txt || { echo "::error::the endpoint scan did not run in enforce mode"; exit 1; }
          grep -qE '^0 failure\(s\), [0-9]+ warning\(s\)$' dist/endpoint-scan.txt || { echo "::error::the endpoint scan reported failures"; exit 1; }
          grep -qx 'public static final String SIGNAL_URL = "https://chat.swarm.green";' dist/buildconfig-endpoints.txt || { echo "::error::BuildConfig.SIGNAL_URL is not https://chat.swarm.green"; exit 1; }
          grep -qx 'public static final org.signal.libsignal.net.Network.Environment LIBSIGNAL_NET_ENV = org.signal.libsignal.net.Network.Environment.SWARM;' dist/buildconfig-endpoints.txt || { echo "::error::libsignal is not on its SWARM environment"; exit 1; }
          echo "SWARM build confirmed: scan enforced with no failure, SIGNAL_URL=https://chat.swarm.green, libsignal environment SWARM."

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="swarm-messenger-android-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          SWARM Messenger for Android, built by CI from \`swarm-main\` at ${GITHUB_SHA}.

          - Variant: \`websiteProdDebug\` (website flavor, prod environment, debug build type).
          - Signed with this CI run's throwaway debug key: uninstall an earlier build before installing this one.
          - Not for general use yet: wave 1 of SWARM Messenger for Android. See \`docs/SWARM-CHANGES.md\`.
          - Check a download with \`sha256sum -c SHA256SUMS.txt\`.

          Based on Signal-Android by Signal Messenger, LLC (AGPL-3.0).
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt dist/endpoint-scan.txt dist/buildconfig-endpoints.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt dist/endpoint-scan.txt dist/buildconfig-endpoints.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "SWARM Messenger for Android $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" --notes-file notes.md
          fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
